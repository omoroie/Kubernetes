# CSR은 쿠버네티스 클러스터 내에서 신원을 증명(인증)받기 위한 '공식 신분증(인증서)' 발급을 요청하는 리소스이다. 
# (단, 구체적인 '권한'은 인증서 발급 이후 RBAC 설정을 통해 따로 부여받아야 한다.)
# kubectl get csr을 이용하여 csr을 조회하고, 
# kubectl certificate <approve | deny> <CSR 이름>으로 허용할지 거부할지를 지정할 수 있다.
# kubectl get csr <CSR_이름> -o jsonpath='{.status.certificate}' | base64 --decode > user.crt 를 이용하여 발급된 인증서 파일을 추출하여 내 컴퓨터에 저장한다

apiVersion: certificates.k8s.io/v1
kind: CertificateSigningRequest
metadata:
  name: akshay
spec:
  groups:
  - system:authenticated
  request: 
  signerName: kubernetes.io/kube-apiserver-client
  usages:
  - client auth