apiVersion: v1
kind: Pod
metadata:
  labels:
    run: mc-pod
  name: mc-pod
  namespace: mc-namespace
spec:
  volumes:
  - name: log-share
    emptyDir: {}
  containers:
  - image: nginx:1-alpine
    name: mc-pod-1
    env:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  - image: busybox:1
    name: mc-pod-2
    command: ["sh", "-c"]
    args:
    - while true; do
        date >> /var/log/shared/date.log;
        sleep 1;
      done
    volumeMounts:
    - mountPath: /var/log/shared
      name: log-share
  - image: busybox:1
    name: mc-pod-3
    command: ["sh", "-c"]
    args: ["tail -f /var/log/shared/date.log"]
    volumeMounts:
    - mountPath: /var/log/shared
      name: log-share