# pod를 특정 노드에 배치하고 싶을때 사용된다 

# requiredDuringSchedulingIgnoredDuringExecution 란
# 조건에 부합하는 노드가 없을경우 배치를 하지 않는 pending 상태로 대기하게 됨(기존 node selector와 동일)

# preferredDuringSchedulingIgnoredDuringExecution 란
# 조건에 부합하는 노드가 없더라도 자원 여유가 있는 다른 노드에 배치를 한다

apiVersion: v1
kind: Pod
metadata:
  name: nginx
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: disktype
            operator: In
            values:
            - ssd        

      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
          - key: disktype
            operator: In
            values:
            - ssd          
  containers:
  - name: nginx
    image: nginx
    imagePullPolicy: IfNotPresent
